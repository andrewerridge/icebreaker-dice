<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Icebreaker dice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&display=swap" rel="stylesheet">
<style>
:root {
  --felt: #1f5c4b;
  --felt-deep: #113a30;
  --ivory: #f5ecd9;
  --ink: #1d1a17;
  --pink: #ff7a9c;
  --sun: #ffd166;
  --text: #f5ecd9;
  --muted: rgba(245, 236, 217, 0.62);
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --felt: #184b3e; --felt-deep: #0b2a22; }
}
:root[data-theme="dark"] { --felt: #184b3e; --felt-deep: #0b2a22; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
*, *::before, *::after { box-sizing: inherit; }
body {
  margin: 0; height: 100%;
  background: radial-gradient(120% 90% at 50% 35%, var(--felt) 0%, var(--felt-deep) 100%);
  background-color: var(--felt-deep);
  color: var(--text);
  font-family: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", sans-serif;
  display: flex; flex-direction: column;
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
}
header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 20px 0;
}
h1 { font-size: 1.05rem; font-weight: 800; margin: 0; letter-spacing: -0.01em; }
.sound {
  font: inherit; font-size: 0.9rem; font-weight: 500;
  color: var(--muted); background: none; border: 1px solid rgba(245,236,217,0.25);
  border-radius: 999px; padding: 6px 14px; cursor: pointer;
}
.sound[aria-pressed="true"] { color: var(--text); border-color: rgba(245,236,217,0.55); }
#stage { flex: 1 1 auto; min-height: 220px; position: relative; cursor: pointer; }
#stage canvas { display: block; width: 100%; height: 100%; }
.bottom {
  padding: 0 20px 24px;
  display: flex; flex-direction: column; align-items: center; gap: 22px;
}
#question {
  min-height: 3.4em; max-width: 22ch;
  margin: 0; text-align: center;
  font-size: clamp(1.5rem, 5.6vw, 2.6rem); font-weight: 800; line-height: 1.08;
  letter-spacing: -0.02em; text-wrap: balance;
  display: flex; align-items: center; justify-content: center;
}
#question.idle { font-weight: 500; font-size: clamp(1.05rem, 3.8vw, 1.3rem); color: var(--muted); }
#question.hide { opacity: 0; transition: opacity 180ms ease; }
#question.pop { animation: pop 620ms cubic-bezier(.2,1.6,.4,1) both; }
@keyframes pop {
  0% { opacity: 0; transform: scale(.55) rotate(-3deg); }
  60% { opacity: 1; transform: scale(1.07) rotate(1deg); }
  100% { opacity: 1; transform: scale(1) rotate(0); }
}
#roll {
  font: inherit; font-weight: 800; font-size: 1.15rem;
  color: var(--ink); background: var(--sun);
  border: none; border-radius: 16px;
  padding: 16px 36px; min-width: 220px; cursor: pointer;
  box-shadow: 0 5px 0 #c99a2e, 0 10px 24px rgba(0,0,0,.25);
  transition: transform 90ms ease, box-shadow 90ms ease, opacity 150ms;
}
#roll:active { transform: translateY(4px); box-shadow: 0 1px 0 #c99a2e, 0 4px 10px rgba(0,0,0,.25); }
#roll:disabled { opacity: .55; cursor: default; }
button:focus-visible { outline: 3px solid var(--pink); outline-offset: 3px; }
@media (prefers-reduced-motion: reduce) {
  #question.pop { animation: fade 300ms ease both; }
  @keyframes fade { from { opacity: 0 } to { opacity: 1 } }
}
</style>
</head>
<body>
<header>
  <h1>Icebreaker dice</h1>
  <button class="sound" id="sound" aria-pressed="true">Sound on</button>
</header>
<div id="stage" aria-label="Three dice. Tap to roll."></div>
<div class="bottom">
  <p id="question" class="idle" aria-live="polite">Roll for a question nobody needed answering.</p>
  <button id="roll">Roll the dice</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/canvas-confetti/1.9.3/confetti.browser.min.js"></script>
<script>
(() => {
// ---------- Question grammar ----------
const CORE = [
  "your favourite","your least favourite","the most overrated","the most underrated","your go-to","your all-time favourite",
  "your second favourite","your ideal","the best","the worst","your perfect","the most annoying"
];
const SPICY = [
  "your guilty-pleasure","your comfort","your controversial","your desert-island","your nemesis","your childhood",
  "your hot-take","your secret favourite","your emergency","your 3am","your hill-to-die-on","your ride-or-die",
  "your spirit","your Friday-afternoon","your post-pub","your lottery-win","your mum's favourite","your deathbed",
  "your rainy-day","your Christmas-Day","your birthday","your karaoke","your pub-quiz","your first-ever",
  "your most-regretted","your holiday","your Monday-morning","your sick-day"
];
const qualifier = () => pick(Math.random() < 0.75 ? CORE : SPICY);
const THINGS = [
  "Coldplay song","cuisine","biscuit","font","motorway service station","Monopoly property",
  "cheese","sandwich filling","emoji","Pixar film","crisp flavour","bird",
  "day of the week","type of weather","kitchen utensil","spreadsheet function","planet","board game",
  "shade of beige","meeting room","sauce","cereal","soup","Greek letter",
  "unit of measurement","household appliance","garden tool","mode of transport","cloud formation","pasta shape",
  "tree","farmyard animal","dog breed","fruit","vegetable","condiment",
  "chocolate bar","ABBA song","Christmas film","keyboard shortcut","email sign-off","stationery item",
  "airport","roundabout","sea creature","dinosaur","pizza topping","gemstone",
  "smell","pub name","Olympic sport","yoga pose","dance move","knot",
  "element on the periodic table","cocktail","hot drink","cake","pudding","houseplant",
  "spice","bread","potato dish","animal","90s ringtone","printer error",
  "Beatles song","Queen song","Spice Girls song","Bond theme","musical","nursery rhyme",
  "sitcom","soap opera","quiz show","game show catchphrase","Disney film","Christmas song",
  "karaoke song","wedding first dance","national anthem","boy band","TV theme tune","dessert",
  "sweet","breakfast cereal","ice cream flavour","jam","tea","fish",
  "cut of meat","sandwich","curry","takeaway","Sunday roast trimming","pie",
  "herb","cheese on toast topping","flavour of Walkers","chocolate in the tin","supermarket","high street shop",
  "motorway","train station","London Underground line","British seaside town","county","castle",
  "bridge","river","mountain","island","ocean","country",
  "capital city","continent","month","season","bank holiday","Olympic event",
  "football ground","racecourse","sport","card game","playground game","Lego set",
  "toy","Mr Men character","Pokémon","constellation","colour","typeface",
  "emoji reaction","app","website","ringtone","car","bicycle",
  "boat","aeroplane","vehicle","piece of furniture","room in the house","pair of shoes",
  "hat","jumper","umbrella","insect","reptile","big cat",
  "monkey","horse breed","cat breed","wild animal","endangered species","flower",
  "weed","vegetable to grow","mushroom","bin day","Excel error","Teams status",
  "PowerPoint transition","office chair","mug","biro","Post-it colour","out-of-office reply",
  "corporate buzzword","meeting excuse","snack drawer item","lunch deal"
];
const PLURALS = [
  "crisps","Beatles albums","dinosaurs","root vegetables","Olympic sports","conspiracy theories",
  "types of pasta","Bond films","houseplants","Christmas songs","reply-all emails","biscuits",
  "clouds","ducks","roundabouts","cheeses","knots","spices",
  "Pixar films","socks","hats","trains","spreadsheets","meetings",
  "out-of-office replies","emojis","board games","podcasts","hairstyles","garden centres",
  "ringtones","puddings","insects","mountains","fonts","sandwiches",
  "shoes","sweets","chocolates","nuts","berries","cereals",
  "soups","sauces","curries","pies","cakes","Mr Men",
  "Lego sets","card games","birds","fish","trees","flowers",
  "musicals","sitcoms","game shows","Disney films","corporate buzzwords","meeting rooms",
  "Teams backgrounds","motorway services","seaside towns","castles","bridges","rivers"
];
const PEOPLE = [
  "Bond villain","Muppet","Bake Off contestant","Roman emperor","Doctor Who companion","Spice Girl",
  "Blue Peter presenter","Tudor","TV chef","Beatle","Teletubby","Greek god",
  "footballer","weather presenter","pirate","Viking","Wimbledon champion","astronaut",
  "sitcom dad","pantomime dame","Egyptian pharaoh","Apprentice candidate","Thunderbird","newsreader",
  "Gladiator","Traitor","snooker player","famous Dave","Bond actor","Disney villain",
  "Disney princess","Muppet Show guest","quiz show host","darts player","Olympian","explorer",
  "inventor","scientist","painter","composer","poet","king",
  "queen","wizard","superhero","cartoon dog","cartoon cat","Womble",
  "Mr Man","Little Miss","Roman god","Norse god","saint","ghost",
  "detective","sitcom neighbour"
];
const ENDINGS = [
  "what would you be","what would your catchphrase be","what would your theme tune be","who would play you in the film","what would your fatal flaw be","where would you go on holiday",
  "what would your superpower be","what would you have for breakfast","what would your LinkedIn headline be","how would you take your tea","what would your autobiography be called","what would your out-of-office say",
  "what would your walk-on music be","what would your star sign be","what would you be scared of","what would your Wi-Fi password be","who would your nemesis be","what would you bring to the office party",
  "what would your last words be","what would your email sign-off be","what would your karaoke song be","what would your Mastermind specialist subject be","what would your Teams status say","what would your motto be",
  "what would you order at the pub","what would your middle name be","what would your hidden talent be","what would you do on a Sunday","what would your pet hate be","what would you be famous for"
];
const AN_EXCEPTIONS = { "unit of measurement": "a" };
const article = n => AN_EXCEPTIONS[n] || (/^[aeiou]/i.test(n) ? "an" : "a");
const pick = a => a[Math.floor(Math.random() * a.length)];

function makeQuestion() {
  const r = Math.random();
  if (r < 0.33) { const q = qualifier(), n = pick(THINGS);  return { dice: ["What is", q, n],  text: `What is ${q} ${n}?` }; }
  if (r < 0.47) { const q = qualifier(), n = pick(PLURALS); return { dice: ["What are", q, n], text: `What are ${q} ${n}?` }; }
  if (r < 0.67) { const q = qualifier(), n = pick(PEOPLE);  return { dice: ["Who is", q, n],   text: `Who is ${q} ${n}?` }; }
  const subj = pick(Math.random() < 0.75 ? THINGS : PEOPLE);
  const d2 = `${article(subj)} ${subj}`;
  let end; const r2 = Math.random();
  if (r2 < 0.05) {
    // rare wildcard: deliberate nonsense crossover
    let other; do { other = pick(THINGS); } while (other === subj);
    end = `which ${other} would you be`;
  } else if (r2 < 0.6) end = "which one would you be";
  else end = pick(ENDINGS);
  return { dice: ["If you were", d2, end], text: `If you were ${d2}, ${end}?` };
}
const recent = [];
function freshQuestion() {
  let q, tries = 0;
  do { q = makeQuestion(); } while (recent.includes(q.text) && ++tries < 20);
  recent.push(q.text); if (recent.length > 40) recent.shift();
  return q;
}

// ---------- Sound ----------
let actx = null, soundOn = true;
const soundBtn = document.getElementById("sound");
soundBtn.addEventListener("click", () => {
  soundOn = !soundOn;
  soundBtn.setAttribute("aria-pressed", String(soundOn));
  soundBtn.textContent = soundOn ? "Sound on" : "Sound off";
});
function audio() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
  if (actx.state === "suspended") actx.resume();
  return actx;
}
function noise(ctx, dur) {
  const b = ctx.createBuffer(1, Math.floor(ctx.sampleRate * dur), ctx.sampleRate);
  const d = b.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  const s = ctx.createBufferSource(); s.buffer = b; return s;
}
function clack() {
  const ctx = soundOn && audio(); if (!ctx) return;
  const t = ctx.currentTime, s = noise(ctx, 0.06), f = ctx.createBiquadFilter(), g = ctx.createGain();
  f.type = "bandpass"; f.frequency.value = 1800 + Math.random() * 600; f.Q.value = 4;
  g.gain.setValueAtTime(0.5, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.06);
  s.connect(f).connect(g).connect(ctx.destination); s.start(t);
}
function partyHorn() {
  const ctx = soundOn && audio(); if (!ctx) return;
  const t = ctx.currentTime;
  // popper crack
  const p = noise(ctx, 0.15), pf = ctx.createBiquadFilter(), pg = ctx.createGain();
  pf.type = "highpass"; pf.frequency.value = 900;
  pg.gain.setValueAtTime(0.9, t); pg.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
  p.connect(pf).connect(pg).connect(ctx.destination); p.start(t);
  // blower horn with a wobble
  const out = ctx.createGain(), lp = ctx.createBiquadFilter();
  lp.type = "lowpass"; lp.frequency.value = 2600;
  out.gain.setValueAtTime(0.0001, t + 0.05);
  out.gain.exponentialRampToValueAtTime(0.16, t + 0.12);
  out.gain.setValueAtTime(0.16, t + 0.55);
  out.gain.exponentialRampToValueAtTime(0.0001, t + 0.8);
  lp.connect(out).connect(ctx.destination);
  const lfo = ctx.createOscillator(), lfoG = ctx.createGain();
  lfo.frequency.value = 14; lfoG.gain.value = 18; lfo.connect(lfoG);
  [0, 7].forEach(det => {
    const o = ctx.createOscillator(); o.type = "sawtooth";
    o.frequency.setValueAtTime(380 + det, t + 0.05);
    o.frequency.exponentialRampToValueAtTime(620 + det, t + 0.3);
    o.frequency.setValueAtTime(620 + det, t + 0.6);
    o.frequency.exponentialRampToValueAtTime(560 + det, t + 0.8);
    lfoG.connect(o.frequency); o.connect(lp); o.start(t + 0.05); o.stop(t + 0.85);
  });
  lfo.start(t); lfo.stop(t + 0.85);
}

// ---------- 3D ----------
const stage = document.getElementById("stage");
const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(32, 1, 0.1, 100);
scene.add(new THREE.HemisphereLight(0xfff6e8, 0x1f5c4b, 0.75));
const sun = new THREE.DirectionalLight(0xffffff, 0.7);
sun.position.set(-3, 9, 5); sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
Object.assign(sun.shadow.camera, { left: -6, right: 6, top: 6, bottom: -6, near: 1, far: 25 });
sun.shadow.radius = 6;
scene.add(sun);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.ShadowMaterial({ opacity: 0.32 }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);

const SIZE = 1.75, HALF = SIZE / 2, RAD = 0.2, GAP = 2.1;
function roundedBox() {
  const g = new THREE.BoxGeometry(SIZE, SIZE, SIZE, 8, 8, 8);
  const pos = g.attributes.position, nrm = g.attributes.normal;
  const lim = HALF - RAD, v = new THREE.Vector3(), inner = new THREE.Vector3(), n = new THREE.Vector3();
  for (let i = 0; i < pos.count; i++) {
    v.fromBufferAttribute(pos, i);
    inner.set(Math.max(-lim, Math.min(lim, v.x)), Math.max(-lim, Math.min(lim, v.y)), Math.max(-lim, Math.min(lim, v.z)));
    n.subVectors(v, inner).normalize();
    v.copy(inner).addScaledVector(n, RAD);
    pos.setXYZ(i, v.x, v.y, v.z); nrm.setXYZ(i, n.x, n.y, n.z);
  }
  return g;
}
const geo = roundedBox();
const FONT = '"Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", sans-serif';
const TEX = 512;
const aniso = renderer.capabilities.getMaxAnisotropy();

function canvasTex() {
  const c = document.createElement("canvas"); c.width = c.height = TEX;
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; t.anisotropy = aniso;
  return { c, ctx: c.getContext("2d"), t };
}
function drawPips(ctx, color, n) {
  ctx.fillStyle = color; ctx.fillRect(0, 0, TEX, TEX);
  const L = 150, M = 256, R = 362;
  const map = { 1: [[M,M]], 2: [[L,L],[R,R]], 3: [[L,L],[M,M],[R,R]], 4: [[L,L],[R,L],[L,R],[R,R]],
    5: [[L,L],[R,L],[M,M],[L,R],[R,R]], 6: [[L,L],[R,L],[L,M],[R,M],[L,R],[R,R]] };
  ctx.fillStyle = "#1d1a17";
  map[n].forEach(([x, y]) => { ctx.beginPath(); ctx.arc(x, y, 40, 0, Math.PI * 2); ctx.fill(); });
}
function layout(ctx, text, box) {
  for (let size = 88; size >= 34; size -= 4) {
    ctx.font = `800 ${size}px ${FONT}`;
    const words = text.replace(/-/g, "-\u0000").split(/[ \u0000]/).filter(Boolean), lines = []; let line = "", ok = true;
    for (const w of words) {
      if (ctx.measureText(w).width > box) { ok = false; break; }
      const test = line ? line + (line.endsWith("-") ? "" : " ") + w : w;
      if (ctx.measureText(test).width > box && line) { lines.push(line); line = w; } else line = test;
    }
    if (!ok) continue;
    lines.push(line);
    const lh = size * 1.02;
    if (lines.length * lh <= box) return { size, lines, lh };
  }
  ctx.font = `800 34px ${FONT}`; return { size: 34, lines: [text], lh: 35 };
}
function drawTop(face, color, text, a) {
  const { ctx, t } = face;
  ctx.globalAlpha = 1; ctx.fillStyle = color; ctx.fillRect(0, 0, TEX, TEX);
  ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillStyle = "#1d1a17";
  if (a < 1) { ctx.globalAlpha = (1 - a) * 0.85; ctx.font = `800 300px ${FONT}`; ctx.fillText("?", 256, 270); }
  if (text && a > 0) {
    ctx.globalAlpha = a;
    const { size, lines, lh } = layout(ctx, text, 410);
    ctx.font = `800 ${size}px ${FONT}`;
    const y0 = 256 - (lines.length - 1) * lh / 2 + size * 0.04;
    lines.forEach((l, i) => ctx.fillText(l, 256, y0 + i * lh));
  }
  ctx.globalAlpha = 1; t.needsUpdate = true;
}

const COLORS = ["#f5ecd9", "#ff8fab", "#ffd166"];
const dice = COLORS.map((color, i) => {
  // face order: +x, -x, +y (top), -y, +z (front), -z
  const pipFor = [3, 4, null, 6, 2, 5];
  const faces = pipFor.map(n => { const f = canvasTex(); if (n) drawPips(f.ctx, color, n); return f; });
  const mats = faces.map(f => new THREE.MeshStandardMaterial({ map: f.t, roughness: 0.5, metalness: 0 }));
  const mesh = new THREE.Mesh(geo, mats);
  mesh.castShadow = true;
  mesh.position.set((i - 1) * GAP, HALF, 0);
  scene.add(mesh);
  const d = { mesh, color, top: faces[2], text: "", fade: 1, fadeStart: 0, roll: null, baseX: (i - 1) * GAP };
  drawTop(d.top, color, "", 0);
  return d;
});

function fit() {
  const w = stage.clientWidth, h = stage.clientHeight; if (!w || !h) return;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  const vf = THREE.MathUtils.degToRad(camera.fov);
  const hf = 2 * Math.atan(Math.tan(vf / 2) * camera.aspect);
  const dist = Math.max(3.35 / Math.tan(hf / 2), 2.4 / Math.tan(vf / 2));
  const dir = new THREE.Vector3(0, 0.86, 0.51).normalize();
  camera.position.copy(dir.multiplyScalar(dist));
  camera.lookAt(0, 0.45, 0);
  camera.updateProjectionMatrix();
}
new ResizeObserver(fit).observe(stage); fit();

// ---------- Rolling ----------
const qEl = document.getElementById("question");
const rollBtn = document.getElementById("roll");
let rolling = false, pending = null, revealAt = 0;
const easeOut = p => 1 - Math.pow(1 - p, 3);
const spins = () => (2 + Math.floor(Math.random() * 3)) * (Math.random() < 0.5 ? -1 : 1) * Math.PI * 2;

function roll() {
  if (rolling) return;
  audio();
  rolling = true; rollBtn.disabled = true;
  pending = freshQuestion();
  qEl.classList.remove("pop", "idle"); qEl.classList.add("hide");
  const now = performance.now();
  dice.forEach((d, i) => {
    d.text = pending.dice[i]; d.fade = 0; d.fadeStart = 0;
    drawTop(d.top, d.color, "", 0);
    d.roll = { start: now + i * 40, dur: reduceMotion ? 300 + i * 150 : 1150 + i * 480,
      sx: spins(), sy: spins() * 0.5, sz: spins(), wob: Math.random() * 6, landed: false };
  });
  revealAt = 0;
}
rollBtn.addEventListener("click", roll);
stage.addEventListener("click", roll);
document.addEventListener("keydown", e => {
  if ((e.code === "Space" || e.code === "Enter") && document.activeElement === document.body) { e.preventDefault(); roll(); }
});

function reveal() {
  qEl.innerHTML = "";
  const inner = document.createElement("span");
  pending.text.split(" ").forEach((w, i) => {
    if (i) inner.appendChild(document.createTextNode(" "));
    if (w.includes("-")) { const s = document.createElement("span"); s.style.whiteSpace = "nowrap"; s.textContent = w; inner.appendChild(s); }
    else inner.appendChild(document.createTextNode(w));
  });
  qEl.appendChild(inner);
  qEl.classList.remove("hide"); void qEl.offsetWidth; qEl.classList.add("pop");
  partyHorn();
  if (window.confetti && !reduceMotion) {
    const r = qEl.getBoundingClientRect();
    const y = Math.min(0.95, (r.top + r.height / 2) / window.innerHeight);
    const colors = ["#ff7a9c", "#ffd166", "#f5ecd9", "#7ee0c3", "#8fb8ff"];
    confetti({ particleCount: 90, angle: 60, spread: 60, startVelocity: 55, origin: { x: 0.05, y }, colors });
    confetti({ particleCount: 90, angle: 120, spread: 60, startVelocity: 55, origin: { x: 0.95, y }, colors });
  }
  rolling = false; rollBtn.disabled = false; rollBtn.textContent = "Roll again";
}

function tick(now) {
  dice.forEach(d => {
    const r = d.roll; if (!r) return;
    const p = Math.max(0, Math.min(1, (now - r.start) / r.dur));
    const k = 1 - easeOut(p);
    d.mesh.rotation.set(r.sx * k, r.sy * k, r.sz * k);
    const hop = Math.abs(Math.sin(Math.PI * 3 * p)) * Math.pow(1 - p, 1.6) * 1.5;
    d.mesh.position.set(d.baseX + Math.sin(p * 9 + r.wob) * 0.18 * k, HALF + hop, Math.cos(p * 7 + r.wob) * 0.15 * k);
    if (p >= 1 && !r.landed) {
      r.landed = true; d.fadeStart = now; clack();
      d.mesh.rotation.set(0, 0, 0); d.mesh.position.set(d.baseX, HALF, 0);
    }
    if (r.landed && d.fade < 1) {
      d.fade = Math.min(1, (now - d.fadeStart) / (reduceMotion ? 150 : 420));
      drawTop(d.top, d.color, d.text, d.fade);
    }
  });
  if (rolling && !revealAt && dice.every(d => d.roll && d.roll.landed && d.fade >= 1)) revealAt = now + 120;
  if (revealAt && now >= revealAt) { revealAt = 0; reveal(); }
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
// redraw faces once the web font arrives
(document.fonts ? document.fonts.load(`800 60px "Bricolage Grotesque"`) : Promise.resolve())
  .catch(() => {}).then(() => dice.forEach(d => drawTop(d.top, d.color, d.text, d.fade === 1 && d.text ? 1 : 0)));
requestAnimationFrame(tick);
})();
</script>
</body>
